---
- name: enable the firewall
  hosts: dev
  become : true


  tasks:
    - name: Allow the SSH CONNECTION
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow the HTTP CONNECTION
      community.general.ufw:
        rule: allow
        proto: tcp
        port: '80'

    - name: Allow the HTTPS CONNECTION
      community.general.ufw:
        rule: allow
        proto: tcp
        port: '443'

    - name: Incoming connection
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Outgoing connection
      community.general.ufw:
        default: allow
        direction: outgoing

    - name: Enable firewall
      community.general.ufw:
        state: enabled
